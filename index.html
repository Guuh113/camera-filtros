<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Câmera com filtros</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f3f5;margin:0;padding:24px;text-align:center;color:#222}
main{max-width:680px;margin:auto}h1{font-size:26px}p{line-height:1.5}
video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#222;border-radius:8px;margin:20px 0}
.botoes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0}
button{font:inherit;padding:10px 14px;border:1px solid #b7bdc5;border-radius:5px;background:white;cursor:pointer}
button[aria-pressed="true"],#iniciar{background:#2463c5;color:white;border-color:#2463c5}
button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #e58c00;outline-offset:3px}
#status{font-size:14px;min-height:40px}footer{font-size:12px;color:#666;margin-top:24px}
</style>
</head>
<body>
<main>
<h1>Câmera com filtros</h1>
<p>Ative a câmera e escolha um filtro para mudar a imagem ao vivo.</p>
<div class="botoes"><button id="iniciar">Ativar câmera</button><button id="parar" disabled>Desligar câmera</button></div>
<video id="video" autoplay muted playsinline aria-label="Transmissão da câmera"></video>
<div class="botoes" aria-label="Filtros">
<button data-filtro="none" aria-pressed="true">Original</button>
<button data-filtro="grayscale(1)" aria-pressed="false">Preto e Branco</button>
<button data-filtro="sepia(1)" aria-pressed="false">Sépia</button>
<button data-filtro="invert(1)" aria-pressed="false">Inverter Cores</button>
<button data-filtro="blur(6px)" aria-pressed="false">Desfocar</button>
</div>
<button id="print" disabled>Salvar print</button>
<p id="status" role="status" aria-live="polite">Permita o acesso à câmera quando o navegador pedir.</p>
<footer>A imagem fica no seu dispositivo. O print só é salvo quando você clicar.</footer>
</main>
<script>
const video=document.getElementById('video');
const iniciar=document.getElementById('iniciar');
const parar=document.getElementById('parar');
const print=document.getElementById('print');
const status=document.getElementById('status');
let stream=null;
let filtro='none';
function desligar(){
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;
 iniciar.disabled=false;parar.disabled=true;print.disabled=true;
 status.textContent='Câmera desligada.';
}
iniciar.addEventListener('click',async()=>{
 if(!navigator.mediaDevices?.getUserMedia){
  status.textContent='Abra pelo GitHub Pages com HTTPS ou por localhost para usar a câmera.';return;
 }
 iniciar.disabled=true;status.textContent='Aguardando permissão da câmera...';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  video.srcObject=stream;await video.play();
  parar.disabled=false;print.disabled=false;
  status.textContent='Câmera ligada! Escolha um filtro ou salve um print.';
  stream.getVideoTracks().forEach(t=>t.addEventListener('ended',desligar));
 }catch(erro){
  desligar();
  const mensagens={
   NotAllowedError:'Permita o acesso à câmera nas configurações do navegador e tente novamente.',
   NotFoundError:'Nenhuma câmera encontrada. Conecte uma câmera e tente novamente.',
   NotReadableError:'A câmera está ocupada ou indisponível. Feche outros aplicativos e tente novamente.'
  };
  status.textContent=mensagens[erro.name]||'Não foi possível abrir a câmera. Tente novamente.';
 }
});
parar.addEventListener('click',desligar);
document.querySelectorAll('[data-filtro]').forEach(botao=>{
 botao.addEventListener('click',()=>{
  filtro=botao.dataset.filtro;video.style.filter=filtro;
  document.querySelectorAll('[data-filtro]').forEach(b=>b.setAttribute('aria-pressed',String(b===botao)));
 });
});
print.addEventListener('click',()=>{
 if(!stream||!video.videoWidth||video.readyState<2){status.textContent='Aguarde a imagem da câmera aparecer.';return;}
 const canvas=document.createElement('canvas');
 canvas.width=video.videoWidth;canvas.height=video.videoHeight;
 const ctx=canvas.getContext('2d');
 if(!ctx || !('filter' in ctx)){
  status.textContent='Este navegador não suporta print com filtros. Use uma captura de tela do dispositivo.';return;
 }
 ctx.filter=filtro;ctx.drawImage(video,0,0,canvas.width,canvas.height);
 canvas.toBlob(blob=>{
  if(!blob){status.textContent='Não foi possível salvar o print. Tente novamente.';return;}
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download='print-camera.png';link.click();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  status.textContent='Print gerado! Confira os downloads do navegador.';
 },'image/png');
});
window.addEventListener('pagehide',desligar);
</script>
</body>
</html>
